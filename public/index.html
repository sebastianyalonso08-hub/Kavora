<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavora</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/blockly@12.3.1/blockly.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script>
<style>
#bootScreen{min-height:100vh;display:grid;place-items:center;background:#050817;color:#eef4ff;font-family:Inter,system-ui,sans-serif}
#bootCard{width:min(560px,calc(100% - 32px));padding:34px;border:1px solid #263b82;border-radius:20px;background:#0b1230;text-align:center;box-shadow:0 20px 80px #0008}
#bootCard img{width:240px;max-width:80%;object-fit:contain}#bootError{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#351424;border:1px solid #a44768;color:#ffd9e5;text-align:left;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"><div id="bootScreen"><div id="bootCard"><img src="/kavora-logo.png" alt="Kavora"><h2>Cargando Kavora…</h2><p>Preparando la plataforma.</p><div id="bootError"></div></div></div></div>
<script>
window.__kavoraBootError=function(e){var box=document.getElementById('bootError');if(box){box.style.display='block';box.textContent='Kavora encontró un error al iniciar.
'+(e&&e.message?e.message:String(e));}};
window.addEventListener('error',function(e){window.__kavoraBootError(e.error||e.message)});
window.addEventListener('unhandledrejection',function(e){window.__kavoraBootError(e.reason)});
</script>
<script type="module" src="/app.js"></script>
</body></html>
