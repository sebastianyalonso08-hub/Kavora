services:
  - type: web
    name: kavora
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: KAVORA_DATA_DIR
        value: "./data"
      - key: KAVORA_UPLOAD_DIR
        value: "./data/uploads"
